name: Verify Gold Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify global installation from Git
        run: |
          npm install -g --install-links --prefix "$RUNNER_TEMP/gold-cli" "git+file://$GITHUB_WORKSPACE#$GITHUB_SHA"
          "$RUNNER_TEMP/gold-cli/bin/gold_backend" --version
          "$RUNNER_TEMP/gold-cli/bin/gold-backend" --version
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const build = JSON.parse(await readFile(process.argv[1], "utf8")); if (build.revision !== process.argv[2]) throw new Error("Installed Git revision was not recorded");' "$RUNNER_TEMP/gold-cli/lib/node_modules/gold-backend/dist/build-info.json" "$GITHUB_SHA"
          "$RUNNER_TEMP/gold-cli/bin/gold_backend" create install-smoke --yes --directory "$RUNNER_TEMP" --no-install --no-git --docs none --no-update-check
          "$RUNNER_TEMP/gold-cli/bin/gold-backend" uninstall
          test ! -e "$RUNNER_TEMP/gold-cli/bin/gold-backend"
          test ! -e "$RUNNER_TEMP/gold-cli/bin/gold_backend"
          test -f "$RUNNER_TEMP/install-smoke/src/server.ts"
      - run: npm pack --dry-run
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, full, smtp, resend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gold-test-password
          MYSQL_DATABASE: gold_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgold-test-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gold
          POSTGRES_PASSWORD: gold-test-password
          POSTGRES_DB: gold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gold -d gold_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import tsx scripts/ci-generated.ts
        env:
          PRESET: ${{ matrix.preset }}
